<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shelf QR Codes</title>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <div class="brandbar"><span class="badge">SAP</span><span class="title">BOPIS Demo Admin</span></div>
  <a class="back" href="/index.html">&larr; back</a>
  <h1>Shelf QR Codes</h1>
  <p>Printable/downloadable QR codes for every shelf &mdash; also useful for testing the
     Android app's <strong>Upload QR photo</strong> option (screenshot or save one of these,
     then pick it from the gallery instead of scanning a physical shelf).</p>
  <div class="grid" id="grid"></div>

  <script>
    // Mirrors backend/scripts/generateQrCodes.ts's fileNameFor(): filenames are the store
    // code + product name, not the cryptic qr_code, so the right one is easy to spot by eye.
    function fileNameFor(storeCode, productName) {
      return `${storeCode} - ${productName}`.replace(/[/\\:*?"<>|]/g, '-').trim();
    }

    async function load() {
      const [shelves, stores] = await Promise.all([
        fetch('/shelves').then((r) => r.json()),
        fetch('/stores').then((r) => r.json()),
      ]);
      const storesById = Object.fromEntries(stores.map((s) => [s.id, s]));
      const grid = document.getElementById('grid');
      grid.innerHTML = shelves
        .map((s) => {
          const store = storesById[s.store_id];
          const name = fileNameFor(store?.code ?? s.store_id, s.product_name);
          return `<div class="card">
            <img src="/qrcodes/${encodeURIComponent(name)}.png" alt="${name}" />
            <div class="label">${s.product_name}</div>
            <div class="meta">${store?.name ?? s.store_id} &middot; aisle ${s.aisle ?? '-'}</div>
            <div class="meta"><a href="/qrcodes/${encodeURIComponent(name)}.png" download>${name}.png</a></div>
          </div>`;
        })
        .join('');
    }
    load();
  </script>
</body>
</html>
